<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Admin E-Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="login-page" data-page="login">
    <main class="login-card">
      <div class="login-head">
        <div class="login-brand">E</div>
        <h2>Masuk Admin</h2>
        <p class="muted">Sistem Informasi Perpustakaan Digital</p>
      </div>

      <form id="loginForm" class="login-form">
        <div class="field">
          <label for="email">Email / Username</label>
          <input id="email" name="username" type="text" value="admin@perpus.id" autocomplete="username" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" value="admin123" autocomplete="current-password" required />
        </div>

        <button class="primary-btn" type="submit">Masuk ke Dashboard</button>
        <p id="loginStatus" role="status" aria-live="polite" style="margin: 0; font-weight: 700; min-height: 1.2em;"></p>
      </form>

      <div class="login-footer">
        Demo admin: admin@perpus.id / admin123
      </div>
    </main>

    <script src="assets/js/main.js"></script>
  </body>
</html>
